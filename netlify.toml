[build]
  command   = "node scripts/build-netlify.js"
  publish   = "dist"

[[redirects]]
  from   = "/reset-password"
  to     = "/auth-return.html"
  status = 200

[[redirects]]
  from   = "/confirm-email"
  to     = "/auth-return.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
