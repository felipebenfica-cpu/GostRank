name: Gerar .exe para Windows

# A cada push no ramo do app, gera uma versão nova (0.2.<número da execução>) e publica em Releases:
#   - LUMENEX-Setup-x.y.z.exe  → instalador; quem instala recebe as próximas versões sozinho (electron-updater)
#   - latest.yml + .blockmap    → usados pela atualização automática
#   - GhostRank-x.y.z.exe       → versão portátil (não se atualiza sozinha; avisa quando há versão nova)
# Também mantém o link antigo (tag teste-etapa-2-grupo-voz / GhostRank-0.1.0.exe) apontando para a versão nova.
on:
  push:
    branches: [etapa-2-grupo-voz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/etapa-2-grupo-voz'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
        continue-on-error: true  # os testes oficiais rodam no Linux (ci.yml)
      - name: Definir a versão
        shell: bash
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Gerar e publicar (instalador + portátil + latest.yml)
        run: npx electron-builder --win nsis portable --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Manter o link antigo funcionando
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          VERSION="0.2.${{ github.run_number }}"
          TAG="teste-${REF//\//-}"
          cp "dist/GhostRank-${VERSION}.exe" "dist/GhostRank-0.1.0.exe"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "dist/GhostRank-0.1.0.exe" "dist/LUMENEX-Setup-${VERSION}.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "LUMENEX (link antigo) - ${VERSION}" \
            --notes "Recomendado: baixe LUMENEX-Setup-${VERSION}.exe e instale uma vez. Depois disso o LUMENEX se atualiza sozinho. O GhostRank-0.1.0.exe é a versão portátil (não se atualiza sozinha). O Windows pode avisar 'O Windows protegeu o computador': clique em 'Mais informações' e depois em 'Executar assim mesmo'."
