<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LUMENEX — Conta</title>
  <link rel="stylesheet" href="auth-return.css">
  <script src="auth-return.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">LUMENEX</h1>
    <p id="status" role="status">Verificando o link…</p>
    <button id="verify" type="button" hidden>Continuar</button>
    <form id="password-form" hidden>
      <label for="password">Nova senha</label>
      <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="password-again">Confirme a nova senha</label>
      <input id="password-again" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <button id="save" type="submit">Salvar nova senha</button>
    </form>
    <p><a href="/">Voltar para o LUMENEX</a></p>
  </main>
</body>
</html>
